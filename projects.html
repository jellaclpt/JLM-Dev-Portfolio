<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLM Dev Portfolio</title>
  <meta name="description" content="All web, mobile and design projects by Jella Mae Calupit." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Great+Vibes&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
  <!-- theme before first paint: saved choice, else the device setting; avoids a dark flash in light mode -->
  <script>
    try { var t = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="curtain" aria-hidden="true"></div>

  <div class="scroll-progress" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- Navigation -->
  <header class="nav" id="nav">
    <a href="index.html#home" class="nav__logo">JLM<span>.</span></a>

    <nav class="nav__links" id="navLinks" aria-label="Main">
      <a href="index.html#home" class="nav__link">Home</a>
      <a href="index.html#about" class="nav__link">About</a>
      <a href="projects.html" class="nav__link is-active" aria-current="page">Projects</a>
      <a href="index.html#tech-stack" class="nav__link">Tech Stack</a>
      <a href="index.html#contact" class="nav__link">Contact</a>
    </nav>

    <!-- light / dark switch: sun shows in dark mode, moon in light mode -->
    <button class="nav__theme" id="themeToggle" type="button" aria-label="Switch to light mode">
      <svg class="nav__theme-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="nav__theme-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
    </button>

    <button class="nav__burger" id="burger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>

  <main>
    <section class="section work work--page" id="projects">
      <a href="index.html#projects" class="back-link">← Back to home</a>

      <div class="work__bar work__bar--page" data-reveal>
        <h1 class="section__title">All Projects</h1>
        <div class="filters" role="tablist" aria-label="Filter projects">
          <button class="filter is-active" data-filter="all">All</button>
          <button class="filter" data-filter="dev">Development</button>
          <button class="filter" data-filter="design">Design</button>
        </div>
      </div>

      <div class="projects" id="projectGrid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__row">
      <span>© <span id="year"></span> JLM Website. All rights reserved.</span>
    </div>
  </footer>

  <button class="to-top" id="toTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <!-- Project modal: fixed size; left = image, role, year, stack, buttons; right = title and scrollable description -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close" data-close aria-label="Close">✕</button>
      <div class="modal__side">
        <p class="modal__shot" id="modalShot"></p>
        <div class="modal__media" id="modalMedia"></div>
        <!-- role on the left, year on the right, stack below (no labels needed) -->
        <div class="modal__meta">
          <p id="modalRole"></p>
          <p class="modal__year" id="modalYear"></p>
        </div>
        <div class="modal__stack">
          <div class="chips" id="modalTags"></div>
        </div>
        <div class="modal__actions">
          <a href="#" class="btn btn--primary" target="_blank" rel="noopener" id="modalLive"><span class="btn__logo"></span>Live demo <span class="btn__arrow">↗</span></a>
          <a href="#" class="btn btn--ghost" target="_blank" rel="noopener" id="modalCode"><svg class="btn__icon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57l-.02-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.09-.73.09-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.67-.31-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22l-.01 3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .3"/></svg>Source code</a>
        </div>
      </div>
      <div class="modal__content">
        <span class="modal__cat" id="modalCat"></span>
        <h3 class="modal__title" id="modalTitle"></h3>
        <div class="modal__body">
          <div class="modal__desc" id="modalDesc"></div>
        </div>
        <div class="modal__pager" id="modalPager" aria-label="Description pages"></div>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
